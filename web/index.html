<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>LogicForge</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0f1116;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        /* Without this, the browser treats touch gestures on the canvas as
           scroll/pinch-zoom/double-tap-zoom instead of passing them to the
           app — breaks tap/drag even once the app's own touch handling is
           correct. */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import init from "./logicforge.js";
      init();
    </script>
  </body>
</html>
